# N2 — deliberately misconfigured: no auth, bound to all interfaces.
bind 0.0.0.0 -::1
protected-mode no
port 6379
daemonize no
dir /var/lib/redis
dbfilename dump.rdb
logfile ""
# requirepass intentionally omitted (empty)

# Redis 7+ blocks CONFIG SET on dir/dbfilename by default (a hardening
# feature added specifically to stop the classic "write an arbitrary file
# via SAVE" technique). Deliberately re-enabled here — this is the whole
# point of N2.
enable-protected-configs yes
enable-debug-command yes
# MODULE LOAD would hand out instant root shells and skip the SNMP +
# sysmaint stages entirely — blocked so the authorized_keys write stays
# the single RCE and the rest of the chain stays mandatory.
enable-module-command no
